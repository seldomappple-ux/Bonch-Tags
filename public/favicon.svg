<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Sleek dark industrial rounded tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="#18181b"/>
  <!-- Crisp white 2-cell vertical label card -->
  <rect x="58" y="42" width="140" height="172" rx="16" fill="#ffffff"/>
  <!-- Outer frame accent -->
  <rect x="66" y="50" width="124" height="156" rx="10" fill="none" stroke="#18181b" stroke-width="8"/>
  <!-- Horizontal divider between icon cell and text cell -->
  <line x1="66" y1="142" x2="190" y2="142" stroke="#18181b" stroke-width="7"/>
  <!-- Bold solid hex nut silhouette in top cell -->
  <path fill="#18181b" fill-rule="evenodd" d="M128 65 L155 80.5 V111.5 L128 127 L101 111.5 V80.5 Z M128 84 A12 12 0 1 0 128 108 A12 12 0 1 0 128 84 Z"/>
  <!-- Clean bold typography bars in bottom cell -->
